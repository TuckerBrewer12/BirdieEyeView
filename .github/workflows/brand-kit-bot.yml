name: Brand Kit Bot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "frontend/src/components/**"
      - "frontend/src/pages/**"
      - "frontend/src/brand/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: brand-kit-bot-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

# Write is for the fix job only. The review job below drops it back to read.
permissions:
  contents: write
  pull-requests: write

jobs:
  brand-kit:
    name: Brand Kit Bot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_fixes: ${{ steps.review.outputs.has_fixes }}
      findings: ${{ steps.review.outputs.findings }}

    # Skip drafts, skip-bots, fork PRs (no OPENCODE_API_KEY), and the PRs
    # this bot itself opens. workflow_dispatch is always allowed so a failed
    # run can be retried from Actions → Brand Kit Bot → Run workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'skip-bots') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !startsWith(github.head_ref, 'bot-fix/')
      )

    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          BASE_FROM_EVENT: ${{ github.event.pull_request.base.sha }}
          HEAD_FROM_EVENT: ${{ github.event.pull_request.head.sha }}
          PR_FROM_INPUT: ${{ inputs.pr_number }}
        run: |
          if [[ -n "${PR_FROM_EVENT}" ]]; then
            echo "number=${PR_FROM_EVENT}" >> "$GITHUB_OUTPUT"
            echo "base=${BASE_FROM_EVENT}" >> "$GITHUB_OUTPUT"
            echo "head=${HEAD_FROM_EVENT}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${PR_FROM_INPUT}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_FROM_INPUT}" \
              --jq '"number=\(.number)\nbase=\(.base.sha)\nhead=\(.head.sha)"' \
              >> "$GITHUB_OUTPUT"
          else
            echo "::error::workflow_dispatch requires a pull request number."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR head
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: git fetch origin "pull/${PR_NUMBER}/head"

      # The installer adds ~/.opencode/bin to $GITHUB_PATH itself.
      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Review
        id: review
        env:
          BOT_NAME: "🎨 Brand Kit Bot"
          BOT_PROMPT: .github/review-bots/brand-kit.md
          BOT_PATHSPEC: "frontend/src/components frontend/src/pages frontend/src/brand"
          BOT_CLEAN: "Nothing to flag against the brand kit in this PR."
          BOT_LEAD: "against the brand kit"
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bash .github/review-bots/run-bot.sh

  fix:
    name: Open fix PRs
    needs: brand-kit
    if: needs.brand-kit.outputs.has_fixes == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/review-fix.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_ref: ${{ github.event.pull_request.head.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      findings_json: ${{ needs.brand-kit.outputs.findings }}
      bot_name: "🎨 Brand Kit Bot"
    secrets: inherit
