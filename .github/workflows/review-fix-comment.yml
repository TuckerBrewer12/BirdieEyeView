name: Review Fix (comment)

on:
  pull_request_review_comment:
    types: [created]

# Workflow file for this event comes from the default branch. The reusable
# workflow it calls opens the fix PR with write permissions of its own.
permissions:
  contents: write
  pull-requests: write

jobs:
  parse:
    name: Parse /fix
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      findings_json: ${{ steps.parse.outputs.findings }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
      head_ref: ${{ steps.parse.outputs.head_ref }}
      head_sha: ${{ steps.parse.outputs.head_sha }}
      bot_name: ${{ steps.parse.outputs.bot_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse /fix
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PARENT_ID: ${{ github.event.comment.in_reply_to_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BOT_NAME: Review Bot
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          allowed="OWNER MEMBER COLLABORATOR"
          if [[ "$COMMENT_USER" != "$PR_USER" && " $allowed " != *" $AUTHOR_ASSOCIATION "* ]]; then
            echo "findings=[]" >> "$GITHUB_OUTPUT"
            echo "Not a collaborator; ignoring."
            exit 0
          fi
          if [[ -n "${PARENT_ID:-}" && "$PARENT_ID" != "null" ]]; then
            PARENT_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/comments/${PARENT_ID}" --jq .body)"
            export PARENT_BODY
          fi
          python3 .github/review-bots/findings.py from-comment > "$RUNNER_TEMP/fixable.json"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "bot_name=${BOT_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "findings<<EOF"
            cat "$RUNNER_TEMP/fixable.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  apply:
    needs: parse
    if: needs.parse.outputs.findings_json != '' && needs.parse.outputs.findings_json != '[]'
    uses: ./.github/workflows/review-fix.yml
    with:
      pr_number: ${{ needs.parse.outputs.pr_number }}
      head_ref: ${{ needs.parse.outputs.head_ref }}
      head_sha: ${{ needs.parse.outputs.head_sha }}
      findings_json: ${{ needs.parse.outputs.findings_json }}
      bot_name: ${{ needs.parse.outputs.bot_name }}
    secrets: inherit
