name: Frontend coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "frontend/**"
      - ".github/review-bots/frontend-coverage.md"
      - ".github/review-bots/run-coverage.sh"
      - ".github/review-bots/coverage_report.py"
      - ".github/workflows/frontend-coverage-bot.yml"

concurrency:
  group: frontend-coverage-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Frontend coverage comment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # Skip drafts, skip on the `skip-bots` label, and skip fork PRs, which
    # cannot read OPENCODE_API_KEY.
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-bots') &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest with coverage
        run: npm run test:coverage

      - name: Install opencode
        working-directory: .
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Report coverage
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bash .github/review-bots/run-coverage.sh
