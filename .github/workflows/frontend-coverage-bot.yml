name: Frontend coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "frontend/**"
      - ".github/review-bots/frontend-coverage.md"
      - ".github/review-bots/run-coverage.sh"
      - ".github/review-bots/coverage_report.py"
      - ".github/review-bots/post_review.py"
      - ".github/review-bots/pr-lib.sh"
      - ".github/review-bots/sticky.py"
      - ".github/workflows/frontend-coverage-bot.yml"

concurrency:
  group: frontend-coverage-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Frontend coverage comment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # Skip drafts, skip on the `skip-bots` label, and skip fork PRs, which
    # cannot read CURSOR_API_KEY.
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-bots') &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest with coverage
        run: npm run test:coverage

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Espresso with coverage
        run: npm run test:espresso:coverage

      - name: Upload Espresso coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espresso-coverage
          path: frontend/coverage/espresso
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Cursor CLI
        working-directory: .
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Report coverage
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/review-bots/run-coverage.sh
