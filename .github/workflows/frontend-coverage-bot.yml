name: Frontend coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "frontend/**"
      - ".github/review-bots/frontend-coverage.md"
      - ".github/review-bots/run-coverage.sh"
      - ".github/review-bots/coverage_report.py"
      - ".github/workflows/frontend-coverage-bot.yml"

concurrency:
  group: frontend-coverage-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Frontend coverage comment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-bots') &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if unchanged since the last run
        id: gate
        if: github.event.action == 'synchronize'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 .github/review-bots/gate.py frontend .github/review-bots/frontend-coverage.md .github/review-bots/run-coverage.sh .github/review-bots/coverage_report.py .github/workflows/frontend-coverage-bot.yml

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Vitest with coverage
        if: steps.gate.outputs.skip != 'true'
        run: npm run test:coverage

      - name: Install Playwright Chromium
        if: steps.gate.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: UI tests with coverage
        if: steps.gate.outputs.skip != 'true'
        run: npm run test:ui:coverage

      - name: Upload UI test coverage report
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: frontend/coverage/ui
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Cursor CLI
        if: steps.gate.outputs.skip != 'true'
        working-directory: .
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Report coverage
        if: steps.gate.outputs.skip != 'true'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/review-bots/run-coverage.sh
