name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, lint, types, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # bandit[toml] so `-c pyproject.toml` is readable on every version.
          pip install ruff "bandit[toml]"

      # Unit tests. The suite is fully mocked (asyncpg is stubbed with AsyncMock),
      # so no live Postgres is needed. Baseline at time of writing: 96 passed, 4 skipped.
      - name: Unit tests + coverage
        if: matrix.check == 'test'
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=35

      - name: Ruff
        if: matrix.check == 'lint'
        run: ruff check --output-format=github .

      - name: Pyright
        if: matrix.check == 'types'
        uses: jakebailey/pyright-action@v2
        with:
          version: "1.1.403"
          # The repo has never been type-clean; report without failing the build
          # until the existing errors are burned down, then flip this to false.
          no-comments: true
          warnings: false
        continue-on-error: true

      # 0 HIGH findings today; 7 MEDIUM B608 (dynamic SQL built from column
      # names in database/repositories/). Gate on HIGH so this stays meaningful.
      - name: Bandit
        if: matrix.check == 'security'
        run: bandit -c pyproject.toml -r api services database analytics models -lll

  frontend:
    name: Frontend (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        check: [test, lint, types, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        if: matrix.check == 'test'
        run: npm test

      - name: ESLint
        if: matrix.check == 'lint'
        run: npm run lint -- --max-warnings=0

      - name: TypeScript
        if: matrix.check == 'types'
        run: npm run typecheck

      - name: Production build
        if: matrix.check == 'build'
        run: npm run build

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check migration numbering
        run: python scripts/ci/check_migrations.py

      - name: Check .env.example covers every env var read in code
        run: python scripts/ci/check_env_example.py

      - name: Check requirements.txt pins are exact
        run: python scripts/ci/check_requirements_pinned.py
