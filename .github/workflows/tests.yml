name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts of the tree this PR touches. The frontend steps below are
  # guarded on this rather than a top-level `paths:` filter: a skipped step
  # still reports the check as green, whereas a paths-filtered workflow never
  # reports at all and would block a merge once branch protection is on.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/tests.yml'

  python:
    name: Python (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, lint, types, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # bandit[toml] so `-c pyproject.toml` is readable on every version.
          pip install ruff "bandit[toml]"

      # Unit tests. The suite is fully mocked (asyncpg is stubbed with AsyncMock),
      # so no live Postgres is needed.
      - name: Unit tests + coverage
        if: matrix.check == 'test'
        run: pytest -q --ignore=tests/integration --cov --cov-report=term-missing --cov-fail-under=75

      - name: Ruff
        if: matrix.check == 'lint'
        run: ruff check --output-format=github .

      # The frontend's API types are generated from this schema; a model change must regenerate both.
      - name: API schema is current
        if: matrix.check == 'types'
        run: python scripts/dump_openapi.py --check

      - name: Pyright
        if: matrix.check == 'types'
        uses: jakebailey/pyright-action@v2
        with:
          version: "1.1.403"
          # The repo has never been type-clean; report without failing the build
          # until the existing errors are burned down, then flip this to false.
          no-comments: true
          warnings: false
        continue-on-error: true

      # 0 HIGH findings today; 7 MEDIUM B608 (dynamic SQL built from column
      # names in database/repositories/). Gate on HIGH so this stays meaningful.
      - name: Bandit
        if: matrix.check == 'security'
        run: bandit -c pyproject.toml -r api services database analytics models -lll

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: golf_scorecard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d golf_scorecard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/golf_scorecard_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repository integration tests
        run: pytest -q -m integration tests/integration

  backend-diff-coverage:
    name: Backend diff coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect backend changes
        id: backend_changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify "origin/${BASE_REF}^{commit}"
          changed_files="$(git diff --name-only --diff-filter=ACMRT "origin/${BASE_REF}...HEAD")"
          changed=false
          while IFS= read -r file; do
            case "$file" in
              api/*|services/*|database/*|analytics/*|models/*|tests/*|scripts/ci/*|requirements.txt|pyproject.toml)
                changed=true
                break
                ;;
            esac
          done <<< "$changed_files"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.backend_changes.outputs.changed == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.backend_changes.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install diff-cover==10.5.1

      - name: Unit tests with coverage report
        if: steps.backend_changes.outputs.changed == 'true'
        run: >-
          pytest -q --ignore=tests/integration --cov --cov-report=term-missing
          --cov-report=xml:/tmp/backend-coverage.xml --cov-fail-under=75

      - name: Enforce changed-line coverage
        if: steps.backend_changes.outputs.changed == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          diff-cover /tmp/backend-coverage.xml
          --compare-branch="origin/${BASE_REF}"
          --fail-under=75
          --show-uncovered
          --total-percent-float

  frontend:
    name: Frontend (${{ matrix.check }})
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        check: [test, lint, types, build, espresso]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Vitest
        if: needs.changes.outputs.frontend == 'true' && matrix.check == 'test'
        run: npm test

      - name: ESLint
        if: needs.changes.outputs.frontend == 'true' && matrix.check == 'lint'
        run: npm run lint -- --max-warnings=0

      # Unused files and dependencies: dead code an agent left behind, or a package nothing imports.
      - name: Knip
        if: needs.changes.outputs.frontend == 'true' && matrix.check == 'lint'
        run: npm run knip

      - name: Generated API types are current
        if: needs.changes.outputs.frontend == 'true' && matrix.check == 'types'
        run: npm run check:api

      - name: Generated token CSS is current
        if: needs.changes.outputs.frontend == 'true' && matrix.check == 'types'
        run: npm run check:tokens

      - name: TypeScript
        if: needs.changes.outputs.frontend == 'true' && matrix.check == 'types'
        run: npm run typecheck

      - name: Production build
        if: needs.changes.outputs.frontend == 'true' && matrix.check == 'build'
        run: npm run build

      - name: Install Playwright Chromium
        if: needs.changes.outputs.frontend == 'true' && matrix.check == 'espresso'
        run: npx playwright install --with-deps chromium

      - name: Espresso tests
        if: needs.changes.outputs.frontend == 'true' && matrix.check == 'espresso'
        run: npm run test:espresso

      # Without this the trace that `trace: "on-first-retry"` records dies
      # with the runner, and a flaky espresso failure is undebuggable.
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.check == 'espresso'
        with:
          name: espresso-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check migration numbering
        run: python scripts/ci/check_migrations.py

      - name: Check .env.example covers every env var read in code
        run: python scripts/ci/check_env_example.py

      - name: Check requirements.txt pins are exact
        run: python scripts/ci/check_requirements_pinned.py

      - name: Check CI never regenerates screenshot baselines
        run: python scripts/ci/check_no_snapshot_updates.py

      - name: Check every kit component, page and view model has its tests
        run: python scripts/ci/check_frontend_conventions.py

      - name: Check backend conventions ruff can't express
        run: python scripts/ci/check_backend_conventions.py
