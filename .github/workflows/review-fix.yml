name: Review Fix

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      findings_json:
        required: true
        type: string
      bot_name:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      empty: ${{ steps.plan.outputs.empty }}
      findings: ${{ steps.plan.outputs.findings }}
    steps:
      - id: plan
        env:
          RAW: ${{ inputs.findings_json }}
        run: |
          python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("RAW") or "[]"
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              data = []
          if not isinstance(data, list):
              data = []
          empty = "true" if not data else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"empty={empty}\n")
              fh.write("findings<<EOF\n")
              fh.write(json.dumps(data, separators=(",", ":")))
              fh.write("\nEOF\n")
          PY

  apply:
    name: Fix (${{ matrix.finding.recipe }})
    needs: plan
    if: needs.plan.outputs.empty == 'false'
    strategy:
      fail-fast: false
      matrix:
        finding: ${{ fromJson(needs.plan.outputs.findings) }}
    runs-on: ${{ matrix.finding.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0

      - name: Load bot scripts
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -f "${GITHUB_WORKSPACE}/.github/review-bots/run-fix.sh" ]]; then
            echo "BOTS_DIR=${GITHUB_WORKSPACE}/.github/review-bots" >> "$GITHUB_ENV"
            exit 0
          fi
          git fetch origin "$DEFAULT_BRANCH" --depth 1
          mkdir -p "$RUNNER_TEMP/review-bots-src"
          git archive "origin/${DEFAULT_BRANCH}" .github/review-bots \
            | tar -x -C "$RUNNER_TEMP/review-bots-src"
          echo "BOTS_DIR=$RUNNER_TEMP/review-bots-src/.github/review-bots" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: matrix.finding.setup != 'none'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        if: matrix.finding.setup == 'frontend' || matrix.finding.setup == 'frontend-playwright'
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        if: matrix.finding.setup == 'frontend-playwright'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Apply fix
        env:
          FINDING_JSON: ${{ toJson(matrix.finding) }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BOT_NAME: ${{ inputs.bot_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bash "$BOTS_DIR/run-fix.sh"
