name: Screenshots

# NOTE: this `paths:` filter must move to the `changes`-job pattern used in
# tests.yml before this check is ever marked required — a paths-filtered
# workflow never reports at all on a backend-only PR, which would hang the
# merge rather than pass it.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/screenshots.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  shard:
    name: Screenshots (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pick specs
        id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SPEC_SELECTION: ${{ vars.SPEC_SELECTION }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          args=(--kind screenshot --github-output "$GITHUB_OUTPUT")
          if [[ "${{ matrix.shard }}" == 1 ]]; then args+=(--summary "$GITHUB_STEP_SUMMARY"); fi
          if [[ "$EVENT" == pull_request ]]; then args+=(--base HEAD^1); else args+=(--all "a $EVENT run"); fi
          node scripts/select-specs.mjs "${args[@]}"

      - name: Screenshot tests
        if: steps.pick.outputs.mode != 'none'
        env:
          FILES: ${{ steps.pick.outputs.files }}
        run: npm run test:screenshots -- --shard=${{ matrix.shard }}/3 --pass-with-no-tests $FILES

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  screenshots:
    name: Frontend visual regression
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.shard.result }}
        run: test "$RESULT" = success
