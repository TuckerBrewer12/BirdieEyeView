name: Screenshots

# NOTE: this `paths:` filter must move to the `changes`-job pattern used in
# tests.yml before this check is ever marked required — a paths-filtered
# workflow never reports at all on a backend-only PR, which would hang the
# merge rather than pass it.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/screenshots.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shard:
    name: Screenshots (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Screenshot tests
        run: npm run test:screenshots -- --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  screenshots:
    name: Frontend visual regression
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.shard.result }}
        run: test "$RESULT" = success
