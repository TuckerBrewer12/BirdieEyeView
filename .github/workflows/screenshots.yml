name: Screenshots

# NOTE: this `paths:` filter must move to the `changes`-job pattern used in
# tests.yml before this check is ever marked required — a paths-filtered
# workflow never reports at all on a backend-only PR, which would hang the
# merge rather than pass it.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/screenshots.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/screenshots.yml"

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    # Pairs with "Frontend (espresso)" in tests.yml: that one gates behavior,
    # this one gates look.
    name: Frontend visual regression
    # macos-latest matches the committed *-darwin.png baselines. The repo is
    # public, so these runner minutes are free.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Screenshot tests
        run: npm run test:screenshots

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
