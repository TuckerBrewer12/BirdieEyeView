[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".venv",
    "frontend",
    "data",
    "database/migrations",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "C4",
    "SIM",
    "RET",
]
ignore = [
    "B008",   # function-call-in-default-argument: this IS the FastAPI Depends() idiom
    "B904",
    "B905",
    "E402",
    "E731",
    "RET504",
    "SIM102",
    "SIM105",
    "SIM112",
    "SIM117",
    "C420",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["api", "services", "database", "analytics", "models"]
omit = [
    "*/__init__.py",
    "analytics/demo.py",
    "analytics/visualize_player_from_db.py",
    "analytics/visualizations.py",
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "frontend", "data"]
