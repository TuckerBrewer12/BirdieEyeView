[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".venv",
    "frontend",
    "data",
    "database/migrations",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "BLE001",
    "DTZ",
    "ASYNC",
    "TID251",
    "SLF001",
    "RUF",
    "PGH003",
    "PGH004",
    "ERA001",
    "T20",
    "FAST001",
    "FAST003",
]
ignore = [
    "B008",   # function-call-in-default-argument: this IS the FastAPI Depends() idiom
    "B905",
    "E402",
    "E731",
    "RET504",
    "SIM102",
    "SIM105",
    "SIM112",
    "SIM117",
    "C420",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Blocking HTTP client: it stalls the event loop when called from a FastAPI handler (api/auth_notifications.py). Use httpx.AsyncClient (httpx is already in requirements.txt)."
"time.sleep".msg = "Blocks the event loop. Use `await asyncio.sleep(...)`."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "ARG", "SLF001", "T20", "TID251"]
"scripts/**" = ["T20", "TID251"]
".github/**" = ["T20", "TID251"]
"analytics/demo.py" = ["T20"]
"analytics/visualize*.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: requires an explicitly configured disposable PostgreSQL database",
]

[tool.coverage.run]
source = ["api", "services", "database", "analytics", "models"]
omit = [
    "*/__init__.py",
    "analytics/demo.py",
    "analytics/visualize_player_from_db.py",
    "analytics/visualizations.py",
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "frontend", "data"]
